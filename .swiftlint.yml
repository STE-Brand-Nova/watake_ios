# SwiftLint config — see engineering plan §9.
# Run: `swiftlint lint --strict` (also runs in pre-commit + CI).

included:
  - watake
  - watakeTests
  - watakeUITests
  - Packages

excluded:
  - watake_ios/DerivedData
  - .build
  - Pods
  - vendor
  - "**/.build"
  - "**/*.generated.swift"

# --- Baseline rules from engineering plan ---
line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

cyclomatic_complexity:
  warning: 10
  error: 15

# User asked: keep files under 1000 lines. Warn at 800, block at 1200.
file_length:
  warning: 800
  error: 1200
  ignore_comment_only_lines: true

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 100

# --- Safety ---
force_unwrapping: warning
force_cast: error
force_try: warning

# --- Opt-in rules worth enabling ---
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - convenience_type
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# --- Disabled (noise for solo dev) ---
disabled_rules:
  # SwiftFormat owns collection comma layout.
  - trailing_comma
  - trailing_whitespace
  - todo

custom_rules:
  no_print_in_production:
    name: "No print() outside DEBUG"
    regex: '(?<!\/\/\s)\bprint\('
    match_kinds:
      - identifier
    message: "Use os.Logger instead of print()."
    severity: warning
    excluded: '.*Tests\.swift'

reporter: "xcode"
